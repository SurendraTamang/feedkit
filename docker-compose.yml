services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: feedkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedkit}
      POSTGRES_DB: feedkit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedkit"]
      interval: 5s
      retries: 10

volumes:
  pgdata: {}
